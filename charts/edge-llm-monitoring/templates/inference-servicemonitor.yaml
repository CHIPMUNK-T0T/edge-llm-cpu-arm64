apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edge-llm-inference
  labels:
    {{- include "edge-llm-monitoring.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.targetNamespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.inference.selectorLabels | nindent 6 }}
  endpoints:
    - port: {{ .Values.inference.metricsPort }}
      path: {{ .Values.inference.metricsPath }}
      interval: {{ .Values.scrapeInterval }}
      scheme: http
