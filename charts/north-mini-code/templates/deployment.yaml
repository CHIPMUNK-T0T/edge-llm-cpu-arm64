apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "north-mini-code.fullname" . }}
  labels:
    {{- include "north-mini-code.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "north-mini-code.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        edge-llm/profile-name: {{ .Values.profile.name | quote }}
      labels:
        {{- include "north-mini-code.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: inference
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.serving.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-model
          image: {{ .Values.profile.runtime.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
{{ .Files.Get "files/prepare-model.sh" | nindent 14 }}
          env:
            - name: SOURCE_FILE
              value: {{ printf "/source/%s" .Values.profile.model.fileName | quote }}
            - name: TARGET_FILE
              value: {{ printf "/models/%s" .Values.profile.model.fileName | quote }}
            - name: EXPECTED_SIZE
              value: {{ .Values.profile.model.sizeBytes | quote }}
            - name: EXPECTED_SHA256
              value: {{ .Values.profile.model.sha256 | quote }}
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source-model
              mountPath: /source
              readOnly: true
            - name: model
              mountPath: /models
      containers:
        - name: llama-server
          image: {{ .Values.profile.runtime.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - {{ printf "/models/%s" .Values.profile.model.fileName | quote }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - {{ .Values.serving.contextSize | quote }}
            - --threads
            - {{ .Values.serving.threads | quote }}
            - --threads-batch
            - {{ .Values.serving.threads | quote }}
            - --parallel
            - "1"
            - --jinja
            - --metrics
            - --ui
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.serving.resources.requests.cpu | quote }}
              memory: {{ .Values.serving.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.serving.resources.limits.cpu | quote }}
              memory: {{ .Values.serving.resources.limits.memory | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.serving.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.serving.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.serving.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.serving.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.serving.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.serving.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.serving.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.serving.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.serving.probes.liveness.failureThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: source-model
          hostPath:
            path: {{ .Values.model.sourcePath | quote }}
            type: Directory
        - name: model
          persistentVolumeClaim:
            claimName: {{ include "north-mini-code.modelPvcName" . }}
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
