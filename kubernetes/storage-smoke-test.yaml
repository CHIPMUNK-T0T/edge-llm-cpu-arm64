apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-smoke
  namespace: edge-llm-smoke
  labels:
    app.kubernetes.io/name: storage-smoke
    app.kubernetes.io/part-of: edge-llm-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Mi
  storageClassName: local-path
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-smoke
  namespace: edge-llm-smoke
  labels:
    app.kubernetes.io/name: storage-smoke
    app.kubernetes.io/part-of: edge-llm-platform
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-smoke
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              expected="edge-llm-storage-ok"
              printf '%s\n' "$expected" > /data/verification.txt
              actual="$(cat /data/verification.txt)"
              test "$actual" = "$expected"
              echo "PVC write/read verification: PASS ($actual)"
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-smoke
