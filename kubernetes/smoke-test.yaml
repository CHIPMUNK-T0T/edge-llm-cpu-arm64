apiVersion: v1
kind: Namespace
metadata:
  name: edge-llm-smoke
  labels:
    app.kubernetes.io/part-of: edge-llm-platform
    app.kubernetes.io/purpose: infrastructure-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-web
  namespace: edge-llm-smoke
  labels:
    app.kubernetes.io/name: smoke-web
    app.kubernetes.io/part-of: edge-llm-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smoke-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-web
        app.kubernetes.io/part-of: edge-llm-platform
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-web
  namespace: edge-llm-smoke
  labels:
    app.kubernetes.io/name: smoke-web
    app.kubernetes.io/part-of: edge-llm-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smoke-web
  ports:
    - name: http
      port: 80
      targetPort: http
